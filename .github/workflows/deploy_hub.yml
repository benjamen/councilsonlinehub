name: Deploy CouncilsOnline Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: 77.37.87.141
  SERVER_USER: frappe-user
  BENCH_PATH: /home/frappe-user/frappe-bench
  SITE_NAME: portal.councilsonline.com
  HUB_APP: councilsonlinehub

concurrency:
  group: server-deploy-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.TAYTAY_SSH_PRIVATE_KEY_B64 }}" | tr -d '\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || {
            echo "ERROR: Failed to decode SSH key"
            exit 1
          }
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<SSH_CONFIG
          Host ${{ env.SERVER_HOST }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          SSH_CONFIG
          chmod 600 ~/.ssh/config
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo SSH OK; hostname"

      - name: Copy deploy script to server
        run: scp -i ~/.ssh/deploy_key scripts/deploy_update.sh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/hub_deploy_update.sh

      - name: Run deploy script on server
        run: ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "chmod +x /tmp/hub_deploy_update.sh && bash /tmp/hub_deploy_update.sh"

      - name: Post-Deployment Verification
        run: |
          sleep 15
          SITE_URL="https://${{ env.SITE_NAME }}"
          echo -n "API ping... "
          curl -fsk "${SITE_URL}/api/method/ping" | grep -q pong && echo "OK" || echo "FAIL (check nginx/SSL)"
          echo -n "Frontend... "
          STATUS=$(curl -sk -o /dev/null -w '%{http_code}' "${SITE_URL}/frontend")
          echo "${STATUS}" | grep -q "^[23]" && echo "OK (${STATUS})" || echo "FAIL (${STATUS})"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Hub Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://${{ env.SITE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** ${{ env.HUB_APP }} (standalone)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
