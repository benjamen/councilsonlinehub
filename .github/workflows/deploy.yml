name: Deploy CouncilsOnline Hub (portal.councilsonline.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.TAYTAY_SERVER_HOST }}
  SERVER_USER: ${{ secrets.TAYTAY_SERVER_USER }}
  BENCH_PATH: /home/frappe-user/frappe-bench
  SITE_NAME: portal.councilsonline.com
  APP_NAME: councilsonlinehub

concurrency:
  group: hub-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.TAYTAY_SSH_PRIVATE_KEY_B64 }}" | tr -d '\n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || {
            echo "ERROR: Failed to decode SSH key."
            exit 1
          }

          if ! file ~/.ssh/deploy_key | grep -q "OpenSSH\|private key\|RSA\|ED25519"; then
            echo "ERROR: Invalid SSH key format after decoding"
            exit 1
          fi

          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<SSH_CONFIG
          Host ${{ env.SERVER_HOST }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile=/dev/null
          SSH_CONFIG
          chmod 600 ~/.ssh/config

          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo '✅ SSH OK'; hostname"

      - name: Deploy to Hub Server
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "
            set -e
            echo 'Starting deployment to ${{ env.SITE_NAME }}...'

            export GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519_benja_repo -o StrictHostKeyChecking=no'

            git config --global --add safe.directory ${{ env.BENCH_PATH }}/apps/${{ env.APP_NAME }}

            echo 'Pulling ${{ env.APP_NAME }} (main)...'
            cd ${{ env.BENCH_PATH }}/apps/${{ env.APP_NAME }}
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git log -1 --oneline

            echo 'Clearing Python bytecode...'
            find ${{ env.BENCH_PATH }}/apps/${{ env.APP_NAME }} -type f -name '*.pyc' -delete
            find ${{ env.BENCH_PATH }}/apps/${{ env.APP_NAME }} -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true

            echo 'Running database migrations...'
            bench --site ${{ env.SITE_NAME }} migrate

            echo 'Importing fixtures...'
            bench --site ${{ env.SITE_NAME }} import-fixtures || echo 'Note: import-fixtures failed, continuing'

            echo 'Clearing caches...'
            bench --site ${{ env.SITE_NAME }} clear-cache
            bench --site ${{ env.SITE_NAME }} clear-website-cache
            redis-cli FLUSHALL || true

            echo 'Restarting services...'
            bench restart || true
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart all || true

            echo 'Hub deployment completed!'
          "

      - name: Post-Deployment Verification
        run: |
          echo 'Running post-deployment verification...'
          sleep 10

          SITE_URL="https://${{ env.SITE_NAME }}"

          echo -n "API ping... "
          STATUS=$(curl -f -s -o /dev/null -w '%{http_code}' $SITE_URL/api/method/ping || echo "000")
          if [ "$STATUS" = "200" ]; then echo "✅ $STATUS"; else echo "❌ $STATUS"; exit 1; fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Hub Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://${{ env.SITE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** ${{ env.APP_NAME }} (main)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
